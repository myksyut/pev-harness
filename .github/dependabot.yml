version: 2
updates:
  # GitHub Actions の自動更新 (CI侵入防止の基礎)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    reviewers:
      - myksyut
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - security
