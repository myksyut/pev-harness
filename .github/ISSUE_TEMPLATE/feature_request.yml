name: Feature request
description: 新機能・改善の提案
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion!

        pev-harness は **ミニマル削ぎ落とし** が設計哲学です (SPEC.md §1)。新機能追加は慎重に評価します。 既存 skill/agent で実現できないか先に確認してください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 「Xができない」ではなく「Yしたい時に困っている」
      placeholder: |
        Phase 1 完了時、計画レビューをチームでするのに plan.md だけだと文脈が足りない。 前回 task との diff も見たい。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: 具体的な機能・コマンド・skill 名
      placeholder: |
        `/pev-status --diff <prev-task-id>` で artifacts/plan.md 同士を diff 表示
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 既存機能で workaround できないか
      placeholder: |
        - 手動で `diff artifacts/plan.md prev-plan.md` でも可能だが手間
        - GitHub PR で見るのが最良? でも plan.md は gitignore 対象...

  - type: dropdown
    id: scope
    attributes:
      label: スコープ感
      options:
        - 小さい (既存 skill/command への追加)
        - 中程度 (新規 skill or command)
        - 大きい (新 phase / 設計変更)

  - type: input
    id: target_version
    attributes:
      label: 希望リリース時期
      placeholder: "v1.2 / v2.0 / 急がない"
