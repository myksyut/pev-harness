<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WS Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f5f5f7;
      }
      header {
        padding: 12px 16px;
        background: #1e1e1e;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      #status {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 10px;
        background: #555;
      }
      #status.ok {
        background: #2e7d32;
      }
      #status.warn {
        background: #ef6c00;
      }
      #status.err {
        background: #c62828;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #joinView,
      #chatView {
        display: none;
        flex: 1;
        flex-direction: column;
      }
      #joinView.active,
      #chatView.active {
        display: flex;
      }
      #joinView {
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #joinView form {
        display: flex;
        gap: 8px;
      }
      #joinView input {
        padding: 8px 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        min-width: 220px;
      }
      #joinView button {
        padding: 8px 16px;
        font-size: 16px;
        border: 0;
        background: #1976d2;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      #joinError {
        color: #c62828;
        font-size: 13px;
        min-height: 1em;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg {
        max-width: 80%;
        padding: 6px 10px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #e0e0e0;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .msg .nick {
        font-weight: 600;
        font-size: 12px;
        color: #555;
        margin-right: 6px;
      }
      .msg.self {
        align-self: flex-end;
        background: #e3f2fd;
        border-color: #bbdefb;
      }
      .msg.system {
        align-self: center;
        background: transparent;
        border: 0;
        color: #888;
        font-size: 12px;
        font-style: italic;
      }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e0e0e0;
        background: #fff;
      }
      #composer input {
        flex: 1;
        padding: 8px 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      #composer button {
        padding: 8px 16px;
        border: 0;
        background: #1976d2;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      #composer button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WS Chat</h1>
      <span id="status">disconnected</span>
    </header>
    <main>
      <section id="joinView" class="active">
        <form id="joinForm" autocomplete="off">
          <input
            id="nicknameInput"
            type="text"
            placeholder="ニックネーム"
            maxlength="32"
            required
          />
          <button type="submit">入室</button>
        </form>
        <div id="joinError"></div>
      </section>
      <section id="chatView">
        <div id="log" aria-live="polite"></div>
        <form id="composer" autocomplete="off">
          <input id="messageInput" type="text" placeholder="メッセージを入力" maxlength="2000" />
          <button id="sendBtn" type="submit" disabled>送信</button>
        </form>
      </section>
    </main>
    <script>
      const joinView = document.getElementById("joinView");
      const chatView = document.getElementById("chatView");
      const joinForm = document.getElementById("joinForm");
      const nicknameInput = document.getElementById("nicknameInput");
      const joinError = document.getElementById("joinError");
      const log = document.getElementById("log");
      const composer = document.getElementById("composer");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const statusEl = document.getElementById("status");

      let ws = null;
      let myNickname = null;
      let reconnectAttempts = 0;
      let reconnectTimer = null;
      const MAX_RECONNECT = 5;

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      }

      function appendMessage({ nickname, text, self, system }) {
        const el = document.createElement("div");
        el.className = "msg" + (self ? " self" : "") + (system ? " system" : "");
        if (system) {
          el.textContent = text;
        } else {
          const nick = document.createElement("span");
          nick.className = "nick";
          nick.textContent = nickname + ":";
          const body = document.createElement("span");
          body.textContent = text;
          el.append(nick, body);
        }
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      function appendLocalNotice(text) {
        appendMessage({ system: true, text });
      }

      function wsUrl() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return `${proto}//${location.host}`;
      }

      function connect(nickname) {
        setStatus("connecting…", "warn");
        ws = new WebSocket(wsUrl());

        ws.addEventListener("open", () => {
          reconnectAttempts = 0;
          ws.send(JSON.stringify({ type: "join", nickname }));
        });

        ws.addEventListener("message", (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          if (msg.type === "joined") {
            myNickname = msg.nickname;
            setStatus(`connected as ${myNickname}`, "ok");
            sendBtn.disabled = false;
            joinView.classList.remove("active");
            chatView.classList.add("active");
            messageInput.focus();
          } else if (msg.type === "message") {
            appendMessage({
              nickname: msg.nickname,
              text: msg.text,
              self: msg.nickname === myNickname,
            });
          } else if (msg.type === "system") {
            appendMessage({ system: true, text: msg.text });
          } else if (msg.type === "error") {
            if (msg.reason === "empty_nickname") {
              joinError.textContent = "ニックネームを入力してください";
            } else if (msg.reason === "empty_message") {
              appendLocalNotice("空メッセージは送信できません");
            } else {
              appendLocalNotice(`エラー: ${msg.reason}`);
            }
          }
        });

        ws.addEventListener("close", () => {
          sendBtn.disabled = true;
          if (!myNickname) {
            // closed before join completed → likely rejected
            setStatus("disconnected", "err");
            return;
          }
          if (reconnectAttempts >= MAX_RECONNECT) {
            setStatus("再接続失敗。 リロードしてください", "err");
            appendLocalNotice("サーバーから切断されました。 ページをリロードしてください。");
            return;
          }
          reconnectAttempts += 1;
          const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 8000);
          setStatus(`reconnecting (${reconnectAttempts}/${MAX_RECONNECT})…`, "warn");
          appendLocalNotice(`接続が切れました。 ${delay / 1000}s 後に再接続します`);
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => connect(myNickname), delay);
        });

        ws.addEventListener("error", () => {
          // surfaced via 'close'
        });
      }

      joinForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const nickname = nicknameInput.value.trim();
        if (!nickname) {
          joinError.textContent = "ニックネームを入力してください";
          return;
        }
        joinError.textContent = "";
        connect(nickname);
      });

      composer.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          appendLocalNotice("未接続のため送信できません");
          return;
        }
        ws.send(JSON.stringify({ type: "message", text }));
        messageInput.value = "";
        messageInput.focus();
      });
    </script>
  </body>
</html>
