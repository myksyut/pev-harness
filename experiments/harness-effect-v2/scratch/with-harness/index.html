<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    #todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #todo-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      min-width: 0;
    }

    #todo-input:focus {
      border-color: #555;
    }

    #add-btn {
      padding: 8px 16px;
      font-size: 1rem;
      font-family: inherit;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #add-btn:hover {
      background: #555;
    }

    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    .todo-text.completed {
      text-decoration: line-through;
      color: #999;
    }

    .remove-btn {
      border: none;
      background: transparent;
      font-size: 1rem;
      color: #aaa;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
      line-height: 1;
    }

    .remove-btn:hover {
      background: #f0e0e0;
      color: #c00;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>TODO</h1>
    <form id="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="新しい TODO を入力..."
        autocomplete="off"
      >
      <button id="add-btn" type="submit">追加</button>
    </form>
    <ul id="todo-list"></ul>
  </main>

  <script>
    const STORAGE_KEY = 'todos.v1';
    let todos = [];

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw === null) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          todos = parsed;
        }
      } catch (_e) {
        // parse error or localStorage unavailable — fall back to empty list
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        console.warn('TODO: localStorage への保存に失敗しました。', e);
      }
    }

    function render() {
      const list = document.getElementById('todo-list');
      // clear existing children
      while (list.firstChild) {
        list.removeChild(list.firstChild);
      }

      todos.forEach(function(todo) {
        const li = document.createElement('li');
        li.className = 'todo-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('data-action', 'toggle');
        checkbox.setAttribute('data-id', todo.id);
        checkbox.setAttribute('aria-label', 'complete');

        const span = document.createElement('span');
        span.className = 'todo-text' + (todo.done ? ' completed' : '');
        span.textContent = todo.text;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('data-action', 'remove');
        removeBtn.setAttribute('data-id', todo.id);
        removeBtn.setAttribute('aria-label', '削除');
        removeBtn.textContent = '✕';

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(removeBtn);
        list.appendChild(li);
      });
    }

    function addTodo(text) {
      const trimmed = text.trim();
      if (trimmed === '') return;
      todos.unshift({
        id: crypto.randomUUID(),
        text: trimmed,
        done: false
      });
      saveToStorage();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map(function(todo) {
        if (todo.id === id) {
          return { id: todo.id, text: todo.text, done: !todo.done };
        }
        return todo;
      });
      saveToStorage();
      render();
    }

    function removeTodo(id) {
      todos = todos.filter(function(todo) {
        return todo.id !== id;
      });
      saveToStorage();
      render();
    }

    // Form submit
    document.getElementById('todo-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value;
      const trimmed = text.trim();
      if (trimmed !== '') {
        addTodo(text);
        input.value = '';
      }
      // if trimmed is empty, silent no-op — input is NOT cleared
    });

    // Event delegation on #todo-list
    // - remove button: handled via click
    // - checkbox toggle: handled via change (avoids double-fire from click + change)
    document.getElementById('todo-list').addEventListener('click', function(e) {
      const target = e.target;
      if (target.dataset.action === 'remove' && target.dataset.id) {
        removeTodo(target.dataset.id);
      }
    });

    document.getElementById('todo-list').addEventListener('change', function(e) {
      const target = e.target;
      if (target.dataset.action === 'toggle' && target.dataset.id) {
        toggleTodo(target.dataset.id);
      }
    });

    // Initialize
    loadFromStorage();
    render();
  </script>
</body>
</html>
